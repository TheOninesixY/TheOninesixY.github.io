<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TindMark</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function() {
        const targetUrl = window.__TINDMARK_WEBSITE_URL__;
        if (targetUrl) {
          try {
            const current = window.location;
            const target = new URL(targetUrl, current.href);
            const isDifferentHost = target.host && target.host.toLowerCase() !== current.host.toLowerCase();
            const isLocalhost = current.hostname === 'localhost' || current.hostname === '127.0.0.1';
            if (isDifferentHost && !isLocalhost) {
              const targetBasePath = target.pathname.replace(/\/+$/, '');
              const currentPath = current.pathname.startsWith('/') ? current.pathname : '/' + current.pathname;
              const newPathname = (targetBasePath && targetBasePath !== '/')
                ? `${targetBasePath}${currentPath}`.replace(/\/+/g, '/')
                : currentPath;
              const newUrl = `${target.protocol}//${target.host}${newPathname}${current.search}${current.hash}`;
              if (window.location.href !== newUrl) {
                window.location.replace(newUrl);
                return;
              }
            }
          } catch (e) {
            console.error('WebsiteURL redirect error:', e);
          }
        }
        const saved = localStorage.getItem('blog-theme');
        if (saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const savedAccent = localStorage.getItem('theme-accent-color') || window.__TINDMARK_DEFAULT_ACCENT__;
        if (savedAccent) {
          document.documentElement.style.setProperty('--accent-color', savedAccent);
          document.documentElement.style.setProperty('--border-color', savedAccent);
          document.documentElement.style.setProperty('--text-primary', savedAccent);
        }
      })();
    </script>
    <style>
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.2s ease-out;
      }
      .dark #loading-overlay {
        background-color: #000000;
        color: #ffffff;
      }
      #loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 28px;
        height: 28px;
        border: 2px solid #000000;
        animation: spin 1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .dark .loader {
        border-color: #ffffff;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        margin-top: 16px;
        color: #000000;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .dark .loading-text {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="loader"></div>
      <div class="loading-text">LOADING // TindMark</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/.tindmark/src/main.tsx"></script>
  </body>
</html>
